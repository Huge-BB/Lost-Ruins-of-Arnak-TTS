name: Web Engine

on:
  push:
    branches:
      - web-engine/**
    paths:
      - 'web/**'
      - 'objects/AllCards.4bfea4/**'
      - '.github/workflows/web-engine.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'objects/AllCards.4bfea4/**'
      - '.github/workflows/web-engine.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract TTS card data
        working-directory: web
        run: npm run extract:cards
      - name: Run engine tests
        working-directory: web
        run: npm test
